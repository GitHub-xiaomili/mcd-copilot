<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>麦麦副驾 McCopilot · 车机演示</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121a2b;
    --panel2: #18233a;
    --line: #2a3852;
    --text: #e8edf5;
    --muted: #8fa0bd;
    --m-yellow: #FFC72C;
    --m-red: #DA291C;
    --ok: #2ecc71;
    --warn: #f0a020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05080f;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px;
  }
  .cockpit {
    width: min(1100px, 100%);
    aspect-ratio: 16 / 9;
    background: var(--bg);
    border: 10px solid #1a2436;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--m-red); }
  .brand b { color: var(--m-yellow); }
  .status { display: flex; gap: 18px; align-items: center; font-size: 14px; color: var(--muted); }
  .status .batt { color: var(--ok); }
  .screen {
    flex: 1; padding: 26px 30px; position: relative; overflow: hidden;
  }
  h1.title { font-size: 30px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 15px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-top: 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .tag.ok { background: rgba(46,204,113,.15); color: var(--ok); }
  .tag.warn { background: rgba(240,160,32,.15); color: var(--warn); }
  .tag.bad { background: rgba(218,41,28,.18); color: #ff6a5c; }
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .item {
    background: var(--panel2); border: 2px solid transparent; border-radius: 12px;
    padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .item.focused {
    border-color: var(--m-yellow); background: #1f2c46;
    transform: scale(1.02);
  }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item .price { color: var(--m-yellow); font-weight: 600; }
  .item.picked { box-shadow: inset 0 0 0 2px var(--ok); }
  .item .check { color: var(--ok); font-weight: 700; }
  .rings { display: flex; gap: 40px; justify-content: center; align-items: center; margin-top: 18px; }
  .ring { text-align: center; }
  .ring svg { transform: rotate(-90deg); }
  .ring .lbl { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .ring .big { font-size: 22px; font-weight: 700; }
  .progress { transition: stroke-dashoffset 3s ease; }
  .center-msg {
    text-align: center; margin-top: 10px; color: var(--m-yellow); font-size: 17px; font-weight: 600;
  }
  .hint {
    padding: 10px 22px; background: var(--panel); border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .3px;
  }
  .hint b { color: var(--text); }
  .big-btn {
    margin-top: 22px; display: inline-block; padding: 14px 30px; border-radius: 12px;
    background: var(--m-red); color: #fff; font-size: 18px; font-weight: 700;
  }
  .home { text-align: center; margin-top: 8%; }
  .home .k { color: var(--m-yellow); }
  .code { font-size: 40px; letter-spacing: 6px; color: var(--m-yellow); font-weight: 800; }
  .pill { font-size: 13px; color: var(--muted); }
  .egg { margin-top: 12px; color: var(--ok); }
</style>
</head>
<body>
  <div class="cockpit">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> 麦麦副驾 <b>McCopilot</b></div>
      <div class="status">
        <span id="clock">--:--</span>
        <span class="batt">⚡ 42% · 续航 60km</span>
      </div>
    </div>
    <div class="screen" id="screen"></div>
    <div class="hint" id="hint"></div>
  </div>

<script>
const STORES = [
  { name: "麦当劳·科技园店", dist: 6.2, tag: "ok", tagText: "可达", charger: true },
  { name: "麦当劳·滨江店",   dist: 12.0, tag: "warn", tagText: "紧张", charger: true },
  { name: "麦当劳·机场店",   dist: 110, tag: "bad", tagText: "回不来", charger: false },
];
const MENU = [
  { name: "巨无霸套餐",       kcal: 850, price: 39.5 },
  { name: "板烧鸡腿堡套餐",   kcal: 720, price: 41.0 },
  { name: "麦辣鸡腿堡套餐",   kcal: 780, price: 36.0 },
  { name: "麦香鱼套餐",       kcal: 690, price: 34.5 },
  { name: "开心乐园餐",       kcal: 520, price: 29.5 },
];

const state = { screen: 0, storeFocus: 0, menuFocus: 0, cart: new Set(), code: "" };

const screens = {
  0: () => `
    <div class="home">
      <h1 class="title">麦麦副驾 <span style="color:var(--m-yellow)">McCopilot</span></h1>
      <p class="sub">插上充电枪的那一刻麦麦自动下单，充到 80% 时汉堡刚好到手</p>
      <div class="card" style="max-width:560px;margin:24px auto 0">
        <div class="row"><span class="pill">当前电量</span><b>42%</b></div>
        <div class="row"><span class="pill">剩余续航</span><b>60 km</b></div>
        <div class="row"><span class="pill">最近补能站</span><b>科技园超充站</b></div>
      </div>
      <div class="big-btn">按 <span class="k">Enter</span> 唤醒副驾</div>
    </div>`,
  1: () => `
    <h1 class="title">续航圈店</h1>
    <p class="sub">当前续航 60km · 下一段路程 15km · 三重可达性过滤</p>
    <div class="list">
      ${STORES.map((s, i) => `
        <div class="item ${i === state.storeFocus ? 'focused' : ''}">
          <div><b>${s.name}</b><div class="meta">单程 ${s.dist}km ${s.charger ? '· ⚡有充电桩' : ''}</div></div>
          <span class="tag ${s.tag}">${s.tagText}</span>
        </div>`).join('')}
    </div>`,
  2: () => {
    const C = 2 * Math.PI * 52;
    return `
    <h1 class="title">充电 × 取餐 对齐</h1>
    <p class="sub">插枪充电开始 → 自动估算最佳下单窗口</p>
    <div class="rings">
      ${ring("充电进度", 80, "var(--m-yellow)", C)}
      ${ring("麦麦就绪", 100, "var(--m-red)", C)}
    </div>
    <div class="center-msg">充到 80% ≈ 麦麦刚好到手</div>`;
  },
  3: () => `
    <h1 class="title">方控点餐</h1>
    <p class="sub">方向键选餐 · Enter 加入 / 移除 · 滚轮手感</p>
    <div class="list">
      ${MENU.map((m, i) => `
        <div class="item ${i === state.menuFocus ? 'focused' : ''} ${state.cart.has(i) ? 'picked' : ''}">
          <div><b>${m.name}</b><div class="meta">${m.kcal} kcal</div></div>
          <span class="price">¥${m.price}${state.cart.has(i) ? ' <span class="check">✓已选</span>' : ''}</span>
        </div>`).join('')}
      <div class="item ${state.menuFocus === MENU.length ? 'focused' : ''}" style="justify-content:center">
        <b style="color:var(--m-yellow)">去结算 ›（已选 ${state.cart.size} 项）</b>
      </div>
    </div>`,
  4: () => `
    <h1 class="title">取餐完成</h1>
    <p class="sub">${STORES[state.storeFocus].name} · 到店自取</p>
    <div class="card" style="text-align:center">
      <div class="pill">取餐码</div>
      <div class="code">${state.code}</div>
      <div class="list" style="max-width:420px;margin:14px auto 0">
        ${[...state.cart].map(i => `<div class="row"><span>${MENU[i].name}</span><span class="price">¥${MENU[i].price}</span></div>`).join('')}
      </div>
      <div class="egg">共 ${[...state.cart].reduce((a,i)=>a+MENU[i].kcal,0)} kcal · 碳足迹 ≈ 开车 ${( [ ...state.cart].reduce((a,i)=>a+MENU[i].kcal,0)/90 ).toFixed(1)} km</div>
    </div>
    <div style="text-align:center"><span class="big-btn">按 <span class="k">Enter</span> 返回</span></div>`,
};

function ring(label, pct, color, C) {
  const off = C * (1 - pct / 100);
  return `<div class="ring">
    <svg width="130" height="130" viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="52" fill="none" stroke="#22304a" stroke-width="12"/>
      <circle class="progress" cx="65" cy="65" r="52" fill="none" stroke="${color}"
        stroke-width="12" stroke-linecap="round"
        style="stroke-dasharray:${C};stroke-dashoffset:${C}" data-off="${off}"/>
      <text x="65" y="62" text-anchor="middle" fill="#e8edf5" font-size="22" font-weight="700" transform="rotate(90 65 65)">${pct}%</text>
    </svg>
    <div class="lbl">${label}</div></div>`;
}

function render() {
  document.getElementById("screen").innerHTML = screens[state.screen]();
  document.getElementById("hint").innerHTML = HINTS[state.screen];
  if (state.screen === 2) {
    requestAnimationFrame(() => {
      document.querySelectorAll(".progress").forEach(c => {
        c.style.strokeDashoffset = c.getAttribute("data-off");
      });
    });
  }
  if (state.screen === 4 && !state.code) {
    state.code = String(Math.floor(1000 + Math.random() * 9000));
  }
}

const HINTS = {
  0: "按 <b>Enter</b> 唤醒副驾",
  1: "<b>↑ ↓</b> 选择门店 · <b>Enter</b> 开始充电 · <b>Backspace</b> 返回",
  2: "<b>Enter</b> 去点餐 · <b>Backspace</b> 返回",
  3: "<b>↑ ↓</b> 选餐 · <b>Enter</b> 加入/移除 · <b>→</b> 去结算 · <b>Backspace</b> 返回",
  4: "<b>Enter</b> 返回主屏",
};

function go(s) { state.screen = s; render(); }

document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "Backspace") {
    e.preventDefault();
    if (state.screen === 1 || state.screen === 2) go(0);
    else if (state.screen === 3) go(2);
    else if (state.screen === 4) go(3);
    else if (state.screen === 0) return;
    return;
  }
  if (state.screen === 0) {
    if (k === "Enter") go(1);
  } else if (state.screen === 1) {
    if (k === "ArrowDown") state.storeFocus = (state.storeFocus + 1) % STORES.length;
    else if (k === "ArrowUp") state.storeFocus = (state.storeFocus - 1 + STORES.length) % STORES.length;
    else if (k === "Enter") { state.code = ""; go(2); }
    render();
  } else if (state.screen === 2) {
    if (k === "Enter") go(3);
  } else if (state.screen === 3) {
    const last = MENU.length;
    if (k === "ArrowDown") state.menuFocus = (state.menuFocus + 1) % (last + 1);
    else if (k === "ArrowUp") state.menuFocus = (state.menuFocus - 1 + last + 1) % (last + 1);
    else if (k === "Enter") {
      if (state.menuFocus === last) { if (state.cart.size > 0) go(4); }
      else { state.cart.has(state.menuFocus) ? state.cart.delete(state.menuFocus) : state.cart.add(state.menuFocus); }
    } else if (k === "ArrowRight" && state.menuFocus === last && state.cart.size > 0) go(4);
    render();
  } else if (state.screen === 4) {
    if (k === "Enter") { state.cart = new Set(); state.code = ""; go(0); }
  }
});

function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
tick(); setInterval(tick, 1000 * 30);
render();
</script>
</body>
</html>
